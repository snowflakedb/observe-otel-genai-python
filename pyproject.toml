# Used for local development, not to be published.
[project]
name = "observe-otel-genai-python"
version = "0.0.0" # This is not used.
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-semantic-conventions",
  "opentelemetry-instrumentation",
  "opentelemetry-test-utils",
  "observe-test-util-genai",
  "observe-util-genai",
  "observe-instrumentation-genai-claude-agent-sdk[instruments]",
  "observe-instrumentation-genai-langchain[instruments]",
  "observe-instrumentation-genai-openai[instruments]",
  "observe-instrumentation-genai-openai-agents[instruments]",
]


# https://docs.astral.sh/uv/reference/settings/
[tool.uv]
package = false # https://docs.astral.sh/uv/reference/settings/#package
required-version = ">=0.6.0"

# https://docs.astral.sh/uv/reference/settings/#sources
[tool.uv.sources]
observe-test-util-genai = { workspace = true }
observe-util-genai = { workspace = true }
observe-instrumentation-genai-claude-agent-sdk = { workspace = true }
observe-instrumentation-genai-langchain = { workspace = true }
observe-instrumentation-genai-openai = { workspace = true }
observe-instrumentation-genai-openai-agents = { workspace = true }


# https://docs.astral.sh/uv/reference/settings/#workspace
[tool.uv.workspace]
members = [
  "instrumentation/*",
  "util/opentelemetry-test-util-genai",
  "util/opentelemetry-util-genai",
]

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
line-length = 79
force-exclude = true
extend-exclude = ["*_pb2*.py*"]
output-format = "concise"
extension = { added = "markdown", changed = "markdown", deprecated = "markdown", removed = "markdown", fixed = "markdown" }

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
# Kept identical to upstream so that rebased files do not churn on lint. Ignore
# rules from the default ruleset that don't have auto-fixes available and need to
# be manually resolved, plus E501 and RUF023 which are intentionally ignored.
ignore = [
  "B008", "B009", "B010", "B017", "B018", "B020", "B023", "B026", "B039",
  "BLE001", "C401", "C408", "C417", "DTZ005", "DTZ007", "E501", "FLY002",
  "ISC004", "LOG015", "PERF102", "PERF402", "PIE796", "PLW0602", "PLW1508",
  "PT014", "PYI034", "PYI036", "RUF009", "RUF012", "RUF013", "RUF015",
  "RUF023", "RUF059", "S102", "S110", "S112", "SIM102", "SIM103", "SIM115",
  "SIM117", "SIM118", "SIM210", "TRY002", "TRY004", "TRY201", "TRY401",
  "UP007",
]

[tool.ruff.lint.isort]
detect-same-package = false # to not consider instrumentation packages as first-party
# `observe` is this fork's namespace; `opentelemetry` stays alongside it so that
# import blocks in files carried from upstream keep their original grouping.
known-first-party = ["observe", "opentelemetry"]
known-third-party = [
  "pytest",
]

[tool.ruff.format]
docstring-code-format = true


# https://github.com/microsoft/pyright/blob/main/docs/configuration.md#type-check-rule-overrides
[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
reportMissingTypeStubs = false
pythonVersion = "3.10"
reportPrivateUsage = false  # Ignore private attributes added by instrumentation packages.
reportDeprecated = false  # Ignore deprecation on GenAI enums in opentelemetry.semconv 0.64b0 until semconv-genai python package is published.
include = [
  "instrumentation/opentelemetry-instrumentation-genai-claude-agent-sdk",
  "instrumentation/opentelemetry-instrumentation-genai-langchain",
  "instrumentation/opentelemetry-instrumentation-genai-openai-agents",
  "util/opentelemetry-util-genai",
]
# We should also add type hints to the test suite - It helps on finding bugs.
# We are excluding for now because it's easier, and more important to add to the instrumentation packages.
exclude = [
  "**/dev/**",
  "**/.venv/**",
  "instrumentation/opentelemetry-instrumentation-genai-claude-agent-sdk/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-claude-agent-sdk/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-langchain/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-langchain/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-openai-agents/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-openai-agents/examples/**",
  "util/opentelemetry-util-genai/tests/**/*.py",
]

[dependency-groups]
dev = [
    "tox",
    "tox-uv>=1",
    "pre-commit",
    "towncrier",
]
