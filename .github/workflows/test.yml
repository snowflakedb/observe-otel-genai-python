name: Test

on:
  workflow_call:
    inputs:
      matrix:
        description: |
          JSON `strategy.matrix` value, normally produced by scripts/tox_matrix.py
          in the `prepare` job of ci.yml. Must be of the form
          `{"include": [{"name": ..., "tox_env": ..., "python_version": ...,
          "needs_weaver": <optional bool>}, ...]}`.
        required: true
        type: string

permissions:
  contents: read

jobs:

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python_version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Read pinned weaver version
        if: ${{ matrix.needs_weaver }}
        id: versions
        run: |
          # shellcheck disable=SC2002
          cat versions.env | grep -E '^WEAVER_VERSION=' >> "$GITHUB_OUTPUT"

      - name: Install weaver ${{ steps.versions.outputs.WEAVER_VERSION }}
        if: ${{ matrix.needs_weaver }}
        uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1
        with:
          version: ${{ steps.versions.outputs.WEAVER_VERSION }}

      - name: Run tests
        run: uvx --with tox-uv tox -e "${MATRIX_TOX_ENV}" -- -ra
        env:
          MATRIX_TOX_ENV: ${{ matrix.tox_env }}
