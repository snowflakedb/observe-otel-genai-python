# These will be sorted first in that order.
# All packages that are depended upon by others should be listed here.
[DEFAULT]

sortfirst=
    util/opentelemetry-util-genai
    instrumentation/*

[prerelease]
version=1.3b0.dev

packages=
    all
    observe-util-genai

[release_packages]
# Packages the release workflows may publish (eachdist.py list-release-packages).
# observe-test-util-genai is intentionally absent: it is workspace-internal.
packages=
    observe-instrumentation-genai-claude-agent-sdk
    observe-util-genai

[lintroots]
extraroots=examples/*,scripts/
subglob=*.py,tests/,test/,src/*,examples/*

[testroots]
extraroots=examples/*,tests/
subglob=tests/,test/
