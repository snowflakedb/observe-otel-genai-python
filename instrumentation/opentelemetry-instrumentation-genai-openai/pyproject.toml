[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observe-instrumentation-genai-openai"
dynamic = ["version"]
description = "OpenAI instrumentation for Observe, emitting OpenTelemetry GenAI semantic conventions."
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Snowflake Inc." }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "opentelemetry-api ~= 1.45",
  "opentelemetry-instrumentation >= 0.64b0, <1",
  "opentelemetry-semantic-conventions >= 0.64b0, <1",
  "observe-util-genai >= 0.1.0, <1",
]

[project.optional-dependencies]
instruments = ["openai >= 1.26.0, < 4"]

[project.entry-points.opentelemetry_instrumentor]
openai = "observeinc.instrumentation.genai.openai:OpenAIInstrumentor"

[project.urls]
Homepage = "https://github.com/snowflakedb/observe-otel-genai-python/tree/main/instrumentation/opentelemetry-instrumentation-genai-openai"
Repository = "https://github.com/snowflakedb/observe-otel-genai-python"
Upstream = "https://github.com/open-telemetry/opentelemetry-python-genai/tree/main/instrumentation/opentelemetry-instrumentation-genai-openai"

[tool.hatch.version]
path = "src/observeinc/instrumentation/genai/openai/version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/observeinc"]

[tool.towncrier]
directory = ".changelog"
filename = "CHANGELOG.md"
start_string = "<!-- changelog start -->\n"
template = "../../scripts/changelog_template.j2"
issue_format = "[#{issue}](https://github.com/open-telemetry/opentelemetry-python-genai/pull/{issue})"
wrap = true
issue_pattern = "^(\\d+)"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
